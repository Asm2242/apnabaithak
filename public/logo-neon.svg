<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340" role="img">
  <defs>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fb923c" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ea580c" flood-opacity="0.55"/>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#86efac" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#16a34a" flood-opacity="0.5"/>
    </filter>
    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#facc15" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#17110a"/>
    </linearGradient>
  </defs>
  <!-- outer neon border -->
  <rect x="10" y="10" width="440" height="320" rx="42" fill="none" stroke="#f59e0b" stroke-width="3.5" opacity="0.95" style="filter:url(#glowOrange)"/>
  <rect x="16" y="16" width="428" height="308" rx="36" fill="url(#bgGrad)" stroke="#ffedd5" stroke-width="0.6" opacity="0.12"/>
  <!-- chef hat -->
  <g transform="translate(230,44)" filter="url(#glowOrange)">
    <path d="M -38 -6 C -38 -22 -18 -30 0 -30 C 18 -30 38 -22 38 -6 L 28 12 L -28 12 Z" fill="none" stroke="#fb923c" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M -26 12 L -26 18 L 26 18 L 26 12" fill="none" stroke="#fb923c" stroke-width="3"/>
    <circle cx="-16" cy="-12" r="2.5" fill="#fb923c" opacity="0.9"/>
    <circle cx="0" cy="-18" r="2.5" fill="#fb923c" opacity="0.9"/>
    <circle cx="16" cy="-12" r="2.5" fill="#fb923c" opacity="0.9"/>
  </g>
  <!-- fork left -->
  <g transform="translate(78,96)" stroke="#fb923c" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowOrange)" opacity="0.95">
    <path d="M0 0 L0 52 M-10 0 L-10 22 M-5 0 L-5 22 M5 0 L5 22 M10 0 L10 22 M-10 22 C -10 30 10 30 10 22"/>
    <path d="M0 52 L0 72 M-6 72 L6 72"/>
  </g>
  <!-- spoon right -->
  <g transform="translate(382,96)" stroke="#fb923c" stroke-width="2.8" fill="none" stroke-linecap="round" filter="url(#glowOrange)" opacity="0.95">
    <ellipse cx="0" cy="14" rx="13" ry="17" />
    <path d="M0 31 L0 72 M-6 72 L6 72"/>
  </g>
  <!-- APNA -->
  <text x="230" y="152" text-anchor="middle" font-family="Poppins,Arial Black,sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="#fb923c" filter="url(#glowOrange)">APNA</text>
  <!-- BAITHAK -->
  <text x="230" y="210" text-anchor="middle" font-family="Poppins,Arial Black,sans-serif" font-weight="900" font-size="50" letter-spacing="5" fill="#86efac" filter="url(#glowGreen)">BAITHAK</text>
  <!-- vegetarian banner -->
  <g filter="url(#glowYellow)">
    <rect x="62" y="228" width="336" height="34" rx="17" fill="none" stroke="#facc15" stroke-width="2.2"/>
    <rect x="66" y="232" width="328" height="26" rx="13" fill="#1a1205" opacity="0.35"/>
    <text x="230" y="250.5" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="800" font-size="13.5" letter-spacing="3.2" fill="#fde68a">VEGETARIAN RESTAURANT</text>
  </g>
  <!-- pure veg fresh taste -->
  <text x="158" y="290" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="600" font-size="13" letter-spacing="1.2" fill="#ffedd5" opacity="0.95">Pure Veg.</text>
  <text x="230" y="290" text-anchor="middle" font-size="14">🍃</text>
  <text x="302" y="290" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="600" font-size="13" letter-spacing="1.2" fill="#ffedd5" opacity="0.95">Fresh Taste</text>
  <!-- subtle bottom glow -->
  <ellipse cx="230" cy="318" rx="170" ry="10" fill="#f59e0b" opacity="0.18"/>
</svg>